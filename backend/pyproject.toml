[project]
name = "i-hungry-backend"
version = "0.1.0"
description = "application plotting restaurants by how good/cheap they are"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
